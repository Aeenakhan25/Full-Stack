<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chord Masters</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #170d18; color: #f1f5f9; font-family: 'Segoe UI', system-ui, sans-serif; }
        .bg-nav { background-color: rgba(23, 13, 24, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #321d36; }
        .card-dark { background-color: #231526; border: 1px solid #321d36; }
        .text-gold { color: #eab308; }
        .btn-gold { background-color: #ca8a04; color: #fff; border: none; transition: background-color 0.3s; }
        .btn-gold:hover { background-color: #a16207; color: #fff; }
        .input-dark { background-color: #190c1a; border: 1px solid #321d36; color: #e2e8f0; }
        .input-dark:focus { background-color: #190c1a; color: #fff; border-color: #eab308; box-shadow: none; }
        .input-dark::placeholder { color: #8e8e9c; }
        .animate-fade { animation: fadeIn 0.8s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-nav py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center text-white fw-bolder fs-4" href="index.html">
                <i class="bi bi-music-note-list text-gold me-2"></i>Chord Masters
            </a>
            <div class="ms-auto">
                <a href="signup.html" class="btn btn-outline-secondary text-white border-secondary rounded-pill px-4">Sign Up</a>
            </div>
        </div>
    </nav>

    <div class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-5">
                    <div class="card card-dark rounded-4 p-4 p-sm-5 animate-fade shadow-lg">
                        <div class="text-center mb-4">
                            <div class="border border-secondary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px; background-color: #16161c;">
                                <i class="bi bi-person-fill fs-2 text-gold"></i>
                            </div>
                            <h3 class="fw-bold text-white mb-2">Welcome Back</h3>
                            <p class="text-secondary">Log in to view your collection.</p>
                        </div>
                        
                        <form action="index.html">
                            <div class="mb-4">
                                <label class="form-label fw-medium text-light">Email Address</label>
                                <input type="email" class="form-control form-control-lg input-dark rounded-3" placeholder="you@music.com" required>
                            </div>
                            <div class="mb-4">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <label class="form-label fw-medium text-light mb-0">Password</label>
                                    <a href="#" class="text-decoration-none text-secondary small">Forgot?</a>
                                </div>
                                <input type="password" class="form-control form-control-lg input-dark rounded-3" placeholder="Enter password" required>
                            </div>
                            <button type="submit" class="btn btn-gold btn-lg w-100 py-3 rounded-pill mb-4 fw-bold">Sign In</button>
                            
                            <p class="text-center text-secondary mb-0">New here? <a href="signup.html" class="text-gold text-decoration-none">Create Account</a></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Chord Masters</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #170d18; color: #f1f5f9; font-family: 'Segoe UI', system-ui, sans-serif; }
        .bg-nav { background-color: rgba(23, 13, 24, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #321d36; }
        .card-dark { background-color: #231526; border: 1px solid #321d36; }
        .text-gold { color: #eab308; }
        .btn-gold { background-color: #ca8a04; color: #fff; border: none; transition: background-color 0.3s; }
        .btn-gold:hover { background-color: #a16207; color: #fff; }
        .input-dark { background-color: #190c1a; border: 1px solid #321d36; color: #e2e8f0; }
        .input-dark:focus { background-color: #190c1a; color: #fff; border-color: #eab308; box-shadow: none; }
        .input-dark::placeholder { color: #8e8e9c; }
        .animate-fade { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-nav py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center text-white fw-bolder fs-4" href="index.html">
                <i class="bi bi-music-note-list text-gold me-2"></i>Chord Masters
            </a>
            <div class="ms-auto">
                <a href="cart.html" class="text-secondary text-decoration-none hover-text-white"><i class="bi bi-arrow-left me-2"></i>Back to Cart</a>
            </div>
        </div>
    </nav>

    <div class="container py-5 flex-grow-1 animate-fade">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <h2 class="display-6 fw-bold text-white mb-4 text-center">Secure Checkout</h2>
                
                <div class="card card-dark shadow-lg rounded-4 p-4 p-sm-5 mb-5">
                    <h4 class="fw-bold mb-4 text-white"><i class="bi bi-truck text-secondary me-2"></i>Shipping Details</h4>
                    <form action="index.html">
                        <div class="row g-3 mb-4">
                            <div class="col-sm-6">
                                <label class="form-label text-secondary">First Name</label>
                                <input type="text" class="form-control form-control-lg input-dark rounded-3" required>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label text-secondary">Last Name</label>
                                <input type="text" class="form-control form-control-lg input-dark rounded-3" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-secondary">Address</label>
                                <input type="text" class="form-control form-control-lg input-dark rounded-3" required>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label text-secondary">City</label>
                                <input type="text" class="form-control form-control-lg input-dark rounded-3" required>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label text-secondary">Zip Code</label>
                                <input type="text" class="form-control form-control-lg input-dark rounded-3" required>
                            </div>
                        </div>

                        <hr class="my-5 border-secondary">

                        <h4 class="fw-bold mb-4 text-white"><i class="bi bi-credit-card text-secondary me-2"></i>Payment</h4>
                        <div class="row g-3 mb-5">
                            <div class="col-12">
                                <label class="form-label text-secondary">Card Number</label>
                                <input type="text" class="form-control form-control-lg input-dark rounded-3" placeholder="0000 0000 0000 0000" required>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label text-secondary">Expiry (MM/YY)</label>
                                <input type="text" class="form-control form-control-lg input-dark rounded-3" placeholder="12/25" required>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label text-secondary">CVC</label>
                                <input type="text" class="form-control form-control-lg input-dark rounded-3" placeholder="123" required>
                            </div>
                        </div>

                        <div class="p-4 rounded-4 mb-4 border border-secondary" style="background-color: #16161c;">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="fw-medium text-secondary">Total Amount Due</span>
                                <span class="fs-4 text-white fw-bold">$3,799.00</span>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-gold btn-lg w-100 py-3 rounded-pill fw-bold shadow-sm">
                            Complete Purchase
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

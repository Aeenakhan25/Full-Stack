<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Chord Masters Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #170d18; color: #f1f5f9; font-family: 'Segoe UI', system-ui, sans-serif; }
        .bg-nav { background-color: rgba(23, 13, 24, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #321d36; }
        .card-dark { background-color: #231526; border: 1px solid #321d36; }
        .text-gold { color: #eab308; }
        .btn-gold { background-color: #ca8a04; color: #fff; border: none; transition: background-color 0.3s; }
        .btn-gold:hover { background-color: #a16207; color: #fff; }
        .input-dark { background-color: #190c1a; border: 1px solid #321d36; color: #e2e8f0; }
        .input-dark:focus { background-color: #190c1a; color: #fff; border-color: #eab308; box-shadow: none; }
        .input-dark::placeholder { color: #8e8e9c; }
        .animate-fade { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-nav py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center text-white fw-bolder fs-4" href="index.html">
                <i class="bi bi-music-note-list text-gold me-2"></i>Chord Masters
            </a>
            <span class="badge bg-secondary rounded-pill fw-medium ms-2 px-3 border border-secondary">ADMIN</span>
            <div class="ms-auto">
                <a href="index.html" class="text-secondary text-decoration-none">Exit</a>
            </div>
        </div>
    </nav>

    <div class="container py-5 flex-grow-1 animate-fade">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h2 class="display-6 fw-bold text-white mb-4 text-center">Add New Instrument</h2>
                
                <div class="card card-dark shadow-lg rounded-4 p-4 p-sm-5 mb-5">
                    <form action="index.html">
                        <div class="row g-4">
                            <div class="col-md-8">
                                <label class="form-label text-secondary">Instrument Name</label>
                                <input type="text" class="form-control form-control-lg input-dark rounded-3" placeholder="e.g. Classic Les Paul" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-secondary">Price</label>
                                <div class="input-group input-group-lg">
                                    <span class="input-group-text input-dark border-end-0 rounded-start-3">$</span>
                                    <input type="number" step="0.01" class="form-control input-dark border-start-0 rounded-end-3" placeholder="0.00" required>
                                </div>
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label text-secondary">Category</label>
                                <select class="form-select form-select-lg input-dark rounded-3" required>
                                    <option value="" selected disabled>Select category...</option>
                                    <option value="Guitars">Acoustic Guitars</option>
                                    <option value="Electric">Electric Guitars</option>
                                    <option value="Bass">Bass Guitars</option>
                                    <option value="Drums">Drums</option>
                                    <option value="Keys">Pianos & Synths</option>
                                    <option value="Orchestra">Orchestral (Harps, etc)</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label text-secondary">Description</label>
                                <textarea class="form-control input-dark rounded-3" rows="4" placeholder="Instrument details..." required></textarea>
                            </div>

                            <div class="col-12 mt-5">
                                <div class="d-flex justify-content-end gap-3 pt-4 border-top border-secondary">
                                    <a href="index.html" class="btn btn-outline-secondary btn-lg rounded-pill px-4">Cancel</a>
                                    <button type="submit" class="btn btn-gold btn-lg rounded-pill px-5 shadow-sm">
                                        Publish Item
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
